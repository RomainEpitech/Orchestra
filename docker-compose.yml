services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      platforms:
        - "linux/amd64"
        - "linux/arm64"
    container_name: orchestra_backend
    volumes:
      - ./backend:/var/www/html
    working_dir: /var/www/html
    expose:
      - "9000"
    depends_on:
      - db
    networks:
      - orchestra_network
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

  nginx:
    image: nginx:alpine
    platform: linux/arm64
    container_name: orchestra_nginx
    ports:
      - "${BACKEND_PORT}:80"
    volumes:
      - ./backend:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - orchestra_network

  db:
    image: mysql:8.0
    platform: linux/arm64
    container_name: orchestra_db
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - orchestra_mysql_data:/var/lib/mysql
    networks:
      - orchestra_network

  phpmyadmin:
    image: arm64v8/phpmyadmin:5.2.1
    platform: linux/arm64
    container_name: orchestra_phpmyadmin
    ports:
      - "${PHPMYADMIN_PORT}:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    depends_on:
      - db
    networks:
      - orchestra_network

volumes:
  orchestra_mysql_data:

networks:
  orchestra_network:
    driver: bridge