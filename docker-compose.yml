services:
  backend:
    platform: ${PLATFORM:-linux/arm64}
    build:
      context: ./backend
      dockerfile: Dockerfile
      cache_from: 
        - type=gha
        - type=registry,ref=orchestra-backend:latest
      cache_to: 
        - type=gha,mode=max
        - type=inline
    expose:
      - "9000"
    volumes:
      - ./backend:/var/www/html
      - ./logs:/var/www/logs
      - backend_vendor:/var/www/html/vendor
      - backend_cache:/var/www/html/bootstrap/cache
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: ${MYSQL_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 10s
    restart: unless-stopped
    networks:
      - orchestra_network

  queue-worker-high:
    platform: ${PLATFORM:-linux/arm64}
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: php artisan queue:work --queue=emails,default --tries=3 --timeout=90 --sleep=3 --max-time=3600 --max-jobs=1000
    volumes:
      - ./backend:/var/www/html
      - ./logs:/var/www/logs
      - backend_vendor:/var/www/html/vendor
      - backend_cache:/var/www/html/bootstrap/cache
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: ${MYSQL_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    restart: unless-stopped
    networks:
      - orchestra_network

  queue-worker-low:
    platform: ${PLATFORM:-linux/arm64}
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: php artisan queue:work --queue=logging --tries=2 --timeout=30 --sleep=5 --max-time=3600 --max-jobs=1000
    volumes:
      - ./backend:/var/www/html
      - ./logs:/var/www/logs
      - backend_vendor:/var/www/html/vendor
      - backend_cache:/var/www/html/bootstrap/cache
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: ${MYSQL_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    restart: unless-stopped
    networks:
      - orchestra_network

  nginx:
    platform: ${PLATFORM:-linux/arm64}
    image: nginx:alpine
    container_name: orchestra_nginx
    ports:
      - "${BACKEND_PORT}:80"
    volumes:
      - ./backend:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - orchestra_network

  db:
    platform: ${PLATFORM:-linux/arm64}
    image: mysql:8.0
    container_name: orchestra_db
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USERNAME}", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - orchestra_network

  phpmyadmin:
    platform: ${PLATFORM:-linux/arm64}
    image: arm64v8/phpmyadmin:latest
    container_name: orchestra_phpmyadmin
    ports:
      - "${PHPMYADMIN_PORT}:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - phpmyadmin_data:/var/lib/phpmyadmin
    depends_on:
      - db
    networks:
      - orchestra_network
    restart: unless-stopped

  backup:
    platform: ${PLATFORM:-linux/arm64}
    image: alpine:3.18
    volumes:
      - ./backups:/backups
      - ./bin:/opt/backup
    environment:
      DB_HOST: db
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      MYSQL_TCP_PORT: ${MYSQL_PORT}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS}
      BACKUP_FREQUENCY: ${BACKUP_FREQUENCY}
    entrypoint: []
    command: sh -c "apk add --no-cache mysql-client dcron && chmod +x /opt/backup/backup.sh && /opt/backup/backup.sh --cron"
    depends_on:
      - db
    networks:
      - orchestra_network

volumes:
  dbdata:
  backend_vendor:
  backend_cache:
  phpmyadmin_data:

networks:
  orchestra_network:
    driver: bridge